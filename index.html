async function pbuildList(cat){const w=await pmk(true),tw=w.W-2*w.M,sai=S.saison==='all'?'Toutes les saisons':'Saison '+S.saison,pro=cat==='Pro',

async function pbuildCompo(){const c=compoGet(),f=c.f,sl=FORM[f],a=c.a[ck(c)],w=await pmk(false),cat=S.cc,pl=S.players.filter(p=>p.cat===cat&&inS(p)),ids=new Set(sl.map((s,i)=>a[i]).filter(Boolean));

    P.drawCircle({x:cx,y:cy,size:13.5,color:hexc(col[0]),borderColor:hexc('#1B4332'),borderWidth:1.2});

    if(p){let t=pcl((p.nom||'')+(nk(p.note)?'  '+nk(p.note):''));while(t.length>3&&w.B.widthOfTextAtSize(t,7)>84)t=t.slice(0,-2);const tw=w.B.widthOfTextAtSize(t,7)+10;
      P.drawRectangle({x:cx-tw/2,y:cy-27,width:tw,height:12,color:hexc('#14261E'),opacity:.78});P.drawText(t,{x:cx-tw/2+5,y:cy-23.5,size:7,font:w.B,color:wh})}});
  w.y=top-ph-24;
  w.add();const tw=w.W-2*w.M,C=[['#',22,'c'],['Note',34,'n'],['Joueur',170,'j'],['Pot.',40,'c'],['Âge',34,'c'],['Club',0],['Div.',50,'c'],['Statut',70,'c']];C[5][1]=tw-C.filter((x,k)=>k!==5).reduce((n,x)=>n+x[1],0);
  GRP.forEach(([n,ps])=>{const l=pl.filter(p=>ps.includes(p.poste)).sort(rkSort);psec(w,n+' ('+l.length+')');
    if(!l.length){w.pg.drawText('Aucun joueur',{x:w.M,y:w.y-4,size:9,font:w.F,color:hexc('#6B7C73')});w.y-=18;return}
    prow(w,C,C.map(x=>x[0]),1);l.forEach((p,i)=>prow(w,C,[i+1,p.note,((p.prenom||'')+' '+(p.nom||'').toUpperCase()).trim(),(p.potentiel||'').replace('Potentiel ',''),age(p.naissance),p.club,p.champ,p.statut],0,i%2?'#F6F9F7':'#FFFFFF'));w.y-=12});

async function pdfCompo(){const c=compoGet();await psave(await pbuildCompo(),'Compo_'+CATLBL[S.cc]+'_'+pslug(c.f)+'_'+pslug(S.saison==='all'?'toutes_saisons':S.saison)+'.pdf')}
async function pbuildNotes(){const w=await pmk(true),tw=w.W-2*w.M,f=S.nc||'',nq=(S.nq||'').toLowerCase().trim(),

function addPdf(get,kind){const f=document.querySelector('#md .ft');if(!f)return;const b=document.createElement('button');b.textContent='Exporter PDF';b.onclick=async()=>{b.disabled=true;try{await(kind==='report'?pdfReport:pdfMatch)(get())}catch(e){info('Export PDF impossible : '+(e&&e.message||e))}b.disabled=false};const n=f.querySelector('#no');f.insertBefore(b,n);n.style.display='none'}

function rkRow(p,i){return `<div class="rk" data-rk="${p.id}"><span class="rn">${i+1}</span>${p.note?chip(p):'<span class="ch" style="padding:2px 12px;border-radius:12px;min-width:30px;text-align:center;display:inline-block;border:1px dashed var(--ln);color:var(--mu)">-</span>'}<div class="ri"><b>${esc(p.prenom||'')} ${esc((p.nom||'').toUpperCase())}</b><small>${esc(p.club||'')}${p.champ?' · '+esc(p.champ):''}${age(p.naissance)!==''?' · '+age(p.naissance)+' ans':''}</small></div>${potChip(p)}</div>`}
const rkSort=(a,b)=>{const nk2=p=>{const n=nk(p.note),k=n?'ABCD'.indexOf(n):-1;return k<0?9:k},pk=p=>{const k=Object.keys(POTC).indexOf(p.potentiel);return k<0?9:k},ag2=p=>{const x=age(p.naissance);return x===''||isNaN(x)?999:+x};return nk2(a)-nk2(b)||pk(a)-pk(b)||ag2(a)-ag2(b)||(a.nom||'').localeCompare(b.nom||'')};

const MIGR={'Milieu Défensif (6)':'Milieu défensif','Milieu Central (8)':'Milieu relayeur','Milieu Offensif Central (10)':'Milieu offensif'};
function mig(k){let ch=false;if(k==='players')S.players.forEach(p=>{if(p.cat==='Amateur'&&!p._c27){p.contrat='2027';p._c27=1;ch=true}if(MIGR[p.poste]){p.poste=MIGR[p.poste];ch=true}if(p.champ&&chab(p.champ)!==p.champ){p.champ=chab(p.champ);ch=true}if(p.statut==='Suivi actif'){p.statut='À suivre';ch=true}if(p.statut==='Recomman'+'dé'){p.statut='Validé';ch=true}if(p.cat==='Jeune'&&p.naissance&&String(p.naissance).length>4){p.naissance=String(p.naissance).slice(0,4);ch=true}});if(k==='reports')S.reports.forEach(r=>{if(MIGR[r.k]){r.k=MIGR[r.k];ch=true}Object.keys(r.vals||{}).forEach(q=>{if(/\|Statut de suivi$/.test(q)&&r.vals[q]==='Recomman'+'dé'){r.vals[q]='Validé';ch=true}})});if(['players','reports','matches'].includes(k))S[k].forEach(x=>{if(!x.saison){x.saison=curSeason();ch=true}});if(k==='matches')S.matches.forEach(m=>(m.teams||[]).forEach(t=>{if(t.schema===undefined||/\(\d(?:-\d)+\)\s*$/.test(t.nom||'')){normTeam(t);ch=true}}));return ch}
function curSeason(){const d=new Date(),y=d.getFullYear(),s=d.getMonth()>=6?y:y-1;return s+'-'+(s+1)}
function ck(c){return S.cc+'|'+c.f+'|'+S.saison}
function inS(x){return S.saison==='all'||x.saison===S.saison}
S.saison=localStorage.tr_saison||curSeason();S.cc='Pro';
let _v=0;
function V(fn){if(_v||S.saison==='all')return fn();const f=[S.players,S.reports,S.matches];_v=1;S.players=f[0].filter(inS);S.reports=f[1].filter(inS);S.matches=f[2].filter(inS);try{return fn()}finally{_v=0;[S.players,S.reports,S.matches]=f}}
['renderPlayers','renderGrid','renderNotes','renderCompo','renderReports','renderMatchs','render'].forEach(n=>{const o=window[n];window[n]=(...a)=>V(()=>o(...a))});

{const r0=window.render;window.render=(...a)=>{r0(...a);fillSais()}}

['players','reports','matches'].forEach(k=>{if(mig(k))push(k)});
render();
if(window.claude)claude.use('db').then(db=>{if(!db){setSt('Local seulement');return}DB=db;setSt('');
  ['players','reports','matches','compo'].forEach(k=>db.doc('scout/'+k).onSnapshot(s=>{
    if(s.exists){let j;try{j=JSON.parse(s.data().json)}catch(e){return}

    else if(S[k].length)push(k)},()=>setSt('Erreur de synchro')))});
