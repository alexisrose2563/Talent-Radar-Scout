<title>Talent Radar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{--card:#fff;--th:#EEF3EF;--hv:#FAFAF7;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--g:#1B4332;--g2:#2D6A4F;--bg:#F7F6F1;--ln:#E3E1D9;--ink:#22302B;--mu:#6B7280;--red:#C1443A}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--g);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;letter-spacing:.04em;margin-right:auto}header small{color:#8fd1ad;font-weight:400;font-size:12px;margin-left:8px}
button{font:inherit;font-weight:600;border:1px solid var(--ln);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--g2)}.pri{background:var(--g2);color:#fff;border-color:var(--g2)}.dan{color:var(--red)}
main{padding:20px 28px;max-width:1300px;margin:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar input,.bar select{font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--card)}.bar input{flex:1;min-width:180px}
.tabs button{border-radius:6px 6px 0 0}.tabs .on{background:var(--g);color:#fff;border-color:var(--g)}
#tabs button{background:color-mix(in srgb,var(--g2) 62%,var(--card));border-color:var(--g2);color:#fff}
#tabs button.on{background:var(--g);color:#fff;border-color:var(--g);box-shadow:0 2px 6px rgba(0,0,0,.28)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) #tabs button.on{background:#40916C;border-color:#40916C}}
:root[data-theme=dark] #tabs button.on{background:#40916C;border-color:#40916C}
.bar input,.bar select{background:var(--th);border-radius:18px;padding:7px 14px;font-weight:500;border-style:dashed}
.bar input:focus,.bar select:focus{outline:none;border-style:solid;border-color:var(--g2)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--ln);border-radius:8px;overflow:hidden}
th{background:var(--th);text-align:left;font-size:12px;text-transform:uppercase;color:var(--mu);padding:9px 10px}
td{padding:9px 10px;border-top:1px solid var(--ln)}tr.r{cursor:pointer}tr.r:hover{background:var(--hv)}
.pt{display:inline-block;background:#1F4E8C;color:#fff;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--mu)}
#ov{position:fixed;inset:0;background:rgba(20,40,30,.5);display:none;overflow:auto;padding:30px 16px;z-index:9}
#ov.on{display:block}#md{background:var(--card);max-width:760px;margin:auto;border-radius:10px;overflow:hidden}
#md.wide{max-width:1150px}#md h2{margin:0;padding:14px 20px;background:var(--g);color:#fff;font-size:17px}
.bd{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;max-height:68vh;overflow:auto}
.bd label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;color:var(--mu);margin-bottom:3px}
.bd input,.bd select,.bd textarea{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--ln);border-radius:6px}
.w{grid-column:1/-1}.ft{padding:12px 20px;border-top:1px solid var(--ln);display:flex;gap:8px;justify-content:flex-end}
.note{font-size:12px;color:var(--mu);margin-top:12px}

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12201a;--card:#1b2b24;--th:#22352c;--hv:#22352c;--ink:#E6EFE9;--ln:#2f4238;--mu:#B8CBC0}}
:root[data-theme=dark]{--bg:#12201a;--card:#1b2b24;--th:#22352c;--hv:#22352c;--ink:#E6EFE9;--ln:#2f4238;--mu:#B8CBC0}

body,button,input,select,textarea,table,th,td{font-family:'TRSans',system-ui,'Segoe UI',Arial,sans-serif!important;font-feature-settings:'tnum' 0}
#stbox .stK{grid-template-columns:repeat(3,1fr)}#stbox .stk2{grid-column:auto}@media(min-width:900px){#stbox .stK{grid-template-columns:repeat(6,1fr)}}
#stbox .stS{border:1px solid var(--ln);border-radius:12px;background:var(--card);margin:0 0 10px;overflow:hidden}
#stbox .stSh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:var(--th);border-bottom:1px solid var(--ln)}
#stbox .stSy{display:flex;align-items:baseline;gap:7px;font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
#stbox .stSy b{font-size:16.5px;color:#2D6A4F;letter-spacing:0;font-weight:800;text-transform:none}
#stbox .stSn{font-size:11.5px;color:var(--mu);font-weight:600}
#stbox .stTr{color:var(--ink);display:grid;grid-template-columns:minmax(0,2fr) repeat(6,minmax(0,1fr)) 30px;align-items:center;gap:4px;padding:8px 12px;text-align:center;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
#stbox .stTr+.stTr{border-top:1px solid var(--ln)}
#stbox .stTr.stTh{padding:6px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
#stbox .stTc{text-align:left;min-width:0}
#stbox .stTc b{display:block;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stbox .stTc small{display:block;font-size:11px;font-weight:500;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stbox .stTr .hi{color:#2D6A4F;font-weight:800}
#stbox .stTt{background:var(--hv);font-weight:800}
#stbox .stTr .stedit{width:26px;height:26px;min-height:0;padding:0;display:inline-flex;align-items:center;justify-content:center}
#stbox .lgS{display:none}
@media(max-width:899px){#stbox .lgL{display:none}#stbox .lgS{display:inline}#stbox .stTr{grid-template-columns:minmax(0,1.7fr) repeat(6,minmax(0,.75fr)) 24px;gap:2px;padding:7px 8px;font-size:13px}#stbox .stTh{padding:5px 8px}#stbox .stTc b{font-size:12.5px}#stbox .stTr .stedit{width:22px;height:22px}#stbox .stSy b{font-size:15px}}
#stbox .drk{padding:0 12px 8px;border-radius:12px;overflow:hidden;margin:0 0 10px}
#stbox .drh{margin:0 -12px 8px!important;width:calc(100% + 24px);box-sizing:border-box;max-width:none!important;padding:8px 12px;background:var(--th);border-bottom:1px solid var(--ln);color:#2D6A4F;display:flex;flex-wrap:wrap;align-items:center;gap:2px 7px}
#stbox .drh small{flex-basis:100%}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) #stbox .stSy b,:root:not([data-theme=light]) #stbox .stTr .hi,:root:not([data-theme=light]) #stbox .drh{color:#8FD9AE}}
:root[data-theme=dark] #stbox .stSy b,:root[data-theme=dark] #stbox .stTr .hi,:root[data-theme=dark] #stbox .drh{color:#8FD9AE}
@media(min-width:900px){#md label.la{flex-wrap:wrap!important;gap:5px 8px!important}#md .rate{flex-basis:100%;margin-left:0!important;gap:5px!important}#md .rate button{width:25px!important;height:25px!important}}
#list th .mth{display:flex;align-items:center;gap:16px}
@media(min-width:900px){#list tr[data-mid] span[style*='color:var(--g2)']{color:#2D6A4F!important}}
.msc{color:#2D6A4F!important}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .msc,:root:not([data-theme=light]) #list tr[data-mid] span[style*='color:var(--g2)']{color:#8FD9AE!important}}
:root[data-theme=dark] .msc,:root[data-theme=dark] #list tr[data-mid] span[style*='color:var(--g2)']{color:#8FD9AE!important}
@media(min-width:900px){#mapbox .plf .pnn,#mapbox .plf .pdi{flex:1 1 0!important}}
@media(max-width:899px){#mapbox .plc.plm2 .pcb .pct,#gobox2 .plc.plm2 .pcb .pct,.plc .pcb .pct{grid-column:2/4!important}}


.pc.pce{display:inline-block;min-width:44px;text-align:center;padding:1px 10px;border-radius:12px;border:1.5px dashed #B5C1BA;color:var(--mu);font-weight:700;font-size:12px;background:transparent;box-sizing:border-box}

//PARSE-START
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const HMAP={'nom':'nom','prenom':'prenom','naissance':'naissance','date de naissance':'naissance','nationalite':'nationalite','second poste':'second','pied fort':'pied','taille (cm)':'taille','poids (kg)':'poids','club':'club','club actuel':'club','championnat':'champ','championnat / niveau':'champ','contrat':'contrat','contrat (annee)':'contrat','valeur marchande':'valeur','valeur marchande (€)':'valeur','agent':'agent','points forts':'forts','points faibles':'faibles','potentiel':'potentiel','note':'note','statut de suivi':'statut','statut':'statut','commentaire recruteur':'comment','commentaires':'comment','commentaire':'comment','source / lien':'lien','lien infos':'lien'};
function parseValeur(v){if(typeof v==='number')return v;const m=String(v??'').replace(/\s/g,'').match(/^([\d.,]+)(M|K)?/i);if(!m)return'';const n=parseFloat(m[1].replace(',','.'));return Math.round(n*(/m/i.test(m[2]||'')?1e6:/k/i.test(m[2]||'')?1e3:1))}
function toIso(v){if(typeof v==='number'&&v>1900&&v<2100)return String(v);if(typeof v==='string'&&/^\d{4}$/.test(v.trim()))return v.trim();if(v instanceof Date&&!isNaN(v))return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);return typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v)?v.slice(0,10):''}
function parseRows(rows,cat){
  const out=[];let poste=null,cols=null;
  const AL=[['milieu offensif','Milieu offensif'],['milieu central','Milieu relayeur'],['milieu relayeur','Milieu relayeur'],['milieu defensif','Milieu défensif']];const posteOf=t=>POSTES.find(p=>norm(p)===norm(t))||(AL.find(([k])=>norm(t).startsWith(k))||[])[1]||POSTES.find(p=>norm(t).startsWith(norm(p)));
  rows.forEach((r,i)=>{
    const a=r[0],empty=r.every(c=>c==null||c==='');
    if(empty)return;
    if(norm(a)==='nom'){cols=r.map(h=>HMAP[norm(h)]||null);return}
    const rest=r.slice(1).every(c=>c==null||c==='');
    if(rest&&typeof a==='string'){const p=posteOf(a);if(p){poste=p;cols=null}return}
    if(!cols||!poste)return;
    const o={id:uid(),cat,poste,_c27:1};
    r.forEach((c,j)=>{const k=cols[j];if(!k||c==null||c==='')return;
      if(k==='naissance')o.naissance=cat==='Jeune'?toIso(c).slice(0,4):toIso(c);else if(k==='valeur')o.valeur=parseValeur(c);
      else if(k==='comment'&&/^https?:\/\//.test(String(c)))o.lien=String(c);else o[k]=typeof c==='string'?c.trim():String(c)});
    if(o.nom)out.push(o);
  });
  return out;
}
//PARSE-END
function parseMatches(rows){const out=[];let m=null,t=null,tab=false;
  rows.forEach(r=>{const a=r[0],empty=r.every(c=>c==null||c==='');if(empty){tab=false;return}
    const rest=r.slice(1).every(c=>c==null||c==='');
    if(rest&&typeof a==='string'&&/^match\b/i.test(a.trim())){m=/equipe 1/i.test(a)?null:{titre:a.replace(/^match\s*-?\s*:?\s*/i,'').trim(),teams:[]};if(m)out.push(m);t=null;tab=false;return}
    if(rest&&typeof a==='string'&&m&&/\(.*\)\s*$/.test(a)){t=normTeam({nom:a.trim(),lignes:[]});m.teams.push(t);tab=false;return}
    if(norm(a)==='poste'){tab=true;return}
    if(tab&&t&&r[1]){const g=i=>r[i]==null?'':String(r[i]).trim();t.lignes.push({poste:String(parseFloat(a)||a),joueur:g(1),niveau:g(2),tech:g(3),phys:g(4),intel:g(5),att:g(6),pied:g(7),analyse:g(8)})}});
  return out}
